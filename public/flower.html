<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>気分診断🌼</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="flower.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
<h1>気分診断🌼</h1>

<div id="quiz"></div>
<button id="nextBtn" onclick="next()" style="display:none">次へ</button>
<div id="canvas-holder"></div>

<script>
//質問・選択肢
const questions = [
  { q: "今日の予定は？", options: ["余裕がある","ほどほど","忙しい","余裕がない"] },
  { q: "朝の目覚めは？", options: ["すっきり","普通","眠い","つらい"] },
  { q: "今日の行動は？", options: ["挑戦","いつも通り","控えめ","何もしたくない"] },
  { q: "人との距離感は？", options: ["たくさん","適度","最低限","一人がいい"] },
  { q: "集中力は？", options: ["高い","普通","低め","続かない"] },
  { q: "生活リズムは？", options: ["整っている","まあまあ","乱れている","かなり乱れている"] },
  { q: "今日選ぶなら？", options: ["外出する","友だちと遊ぶ","家で過ごす","早く寝る"] }
];

let qIndex = 0;
let answers = [];
let p5Instance = null;

//スタート画面
function showStartScreen() {
  const box = document.getElementById("quiz");
  box.innerHTML = `
    <div class="option" onclick="startQuiz()">スタート</div>
  `;
  document.getElementById("nextBtn").style.display = "none";
  // キャンバスをクリア
  const canvasHolder = document.getElementById("canvas-holder");
  canvasHolder.innerHTML = "";
  if (p5Instance) {
    p5Instance.remove();
    p5Instance = null;
  }
}

//診断
function startQuiz() {
  qIndex = 0;
  answers = [];
  document.getElementById("nextBtn").style.display = "inline-block";
  showQuestion();
}

function showQuestion() {
  const box = document.getElementById("quiz");
  box.innerHTML = `<h2>${questions[qIndex].q}</h2>`;
  questions[qIndex].options.forEach(opt => {
    const d = document.createElement("div");
    d.className = "option";
    d.innerText = opt;
    d.onclick = () => {
      document.querySelectorAll(".option").forEach(o => o.style.background = "white");
      d.style.background = "#ffd6e7";
      answers[qIndex] = opt;
    };
    box.appendChild(d);
  });
}

//次へボタン
function next() {
  if (!answers[qIndex]) return alert("選択してください");
  qIndex++;
  if (qIndex < questions.length) showQuestion();
  else diagnose();
}

//診断 & 3D花描画
async function diagnose() {
  const quizBox = document.getElementById("quiz");
  quizBox.innerHTML = "<h2>診断中…🌼</h2>";
  document.getElementById("nextBtn").style.display = "none";

  //LLM　API
  const res = await fetch("/api/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answers })
  });

  const data = await res.json();
  const flower = data.flower;

  //3D花描画
  p5Instance = new p5(p => {
    p.setup = () => {
      p.createCanvas(400, 400, p.WEBGL);
      p.loop();
    };

    p.draw = () => {
      p.clear();
      p.noStroke();
      p.ambientLight(160, 160, 160);
      p.directionalLight(180, 180, 180, 0.6, 1, -1);

      let rotateSpeed, breatheAmount;
      if (flower.petalCount >= 7) { rotateSpeed = 0.004; breatheAmount = 0.04; }
      else if (flower.petalCount >= 4) { rotateSpeed = 0.002; breatheAmount = 0.02; }
      else { rotateSpeed = 0.0005; breatheAmount = 0.005; }

      const rot = p.frameCount * rotateSpeed;
      const breathe = 1 + Math.sin(p.frameCount * 0.05) * breatheAmount;

      p.rotateX(0.3);
      p.rotateZ(rot);

      p.push();
      p.scale(2 * breathe);
      p.ambientMaterial(flower.color.r, flower.color.g, flower.color.b);

      for (let i = 0; i < flower.petalCount; i++) {
        p.push();
        p.rotateZ(p.TWO_PI / 8 * i);
        p.translate(0, -45, 0);
        p.ellipsoid(32, 48, 18);
        p.pop();
      }

      p.push();
      p.ambientMaterial(230, 190, 60);
      p.scale(1, 1, 0.6);
      p.sphere(30);
      p.pop();

      p.pop();
    };
  }, "canvas-holder");

  //結果表示 & リスタート
  quizBox.innerHTML = `
    <h2>あなたの花です🌸</h2>
    <div class="option" onclick="showStartScreen()">もう一度診断する</div>
  `;
}

showStartScreen();
</script>
</body>
</html>
