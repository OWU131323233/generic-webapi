<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>MBTI診断</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .question {
      background: #fff;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 10px;
    }

    .answer-buttons {
      display: flex;
      gap: 10px;
    }

    button.answer {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #eee;
      font-size: 16px;
      cursor: pointer;
    }

    button.answer.selected {
      background: #ff9fbf;
      color: #fff;
      font-weight: bold;
    }

    #diagnoseBtn {
      width: 100%;
      margin-top: 30px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff5f9e;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #screen-result {
      display: none;
      text-align: center;
    }

    #result-card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      margin-top: 40px;
    }

    #mbtiType {
      font-size: 32px;
      color: #ff5f9e;
    }

    #restartBtn {
      margin-top: 30px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #ccc;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ================= 診断画面 ================= -->
<div id="screen-question">
  <h1>MBTI性格診断</h1>
  <div id="questions"></div>
  <button id="diagnoseBtn">診断する</button>
</div>

<!-- ================= 結果画面 ================= -->
<div id="screen-result">
  <h1>診断結果</h1>
  <div id="result-card">
    <h2 id="mbtiType"></h2>
    <p id="mbtiDesc"></p>
  </div>
  <button id="restartBtn">もう一度診断する</button>
</div>

<script>
const questions = [
  "初対面の人と話すのは楽しい",
  "計画を立てるのが好き",
  "一人の時間は必要不可欠だ",
  "論理より感情を大切にする",
  "新しいアイデアを考えるのが好き",
  "締切は守るタイプだ",
  "人の気持ちにすぐ気づく",
  "即断即決が得意だ"
];

const answers = {};
const container = document.getElementById("questions");

questions.forEach((q, i) => {
  const div = document.createElement("div");
  div.className = "question";
  div.innerHTML = `
    <p>${q}</p>
    <div class="answer-buttons">
      <button class="answer" data-q="${i}" data-v="yes">Yes</button>
      <button class="answer" data-q="${i}" data-v="no">No</button>
    </div>
  `;
  container.appendChild(div);
});

container.addEventListener("click", (e) => {
  if (!e.target.classList.contains("answer")) return;

  const qIndex = e.target.dataset.q;
  const value = e.target.dataset.v;
  answers[qIndex] = value;

  document
    .querySelectorAll(`button.answer[data-q="${qIndex}"]`)
    .forEach(btn => btn.classList.remove("selected"));

  e.target.classList.add("selected");
});

document.getElementById("diagnoseBtn").onclick = () => {
  const summary = questions.map((q, i) =>
    `${q}：${answers[i] || "未回答"}`
  ).join("\n");

  fetch("/api/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt: summary })
  })
  .then(res => res.json())
  .then(data => {
    const result = data.data;

    document.getElementById("mbtiType").textContent = result.mbti;
    document.getElementById("mbtiDesc").textContent =
      result.description + "（アドバイス：" + result.advice + "）";

    // ★ 画面切り替え
    document.getElementById("screen-question").style.display = "none";
    document.getElementById("screen-result").style.display = "block";
  })
  .catch(() => alert("診断に失敗しました"));
};

document.getElementById("restartBtn").onclick = () => {
  location.reload();
};
</script>

</body>
</html>
