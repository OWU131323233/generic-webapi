<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MBTI診断</title>
<script src="https://cdn.socket.io/4.5.1/socket.io.min.js"></script>
</head>

<body>
<h1>MBTI性格診断</h1>

<div id="questions"></div>
<button onclick="diagnose()">診断する</button>

<hr>

<div id="result"></div>

<h2>スマホを傾けてAI相談</h2>
<p>左：共感AI ／ 右：現実AI ／ 前：厳しめAI</p>

<div id="chat"></div>

<script>
const socket = io();
socket.emit("join", "mbti");

let currentAI = "";
let mbtiType = "";

socket.on("sensor", (data) => {
  const g = parseFloat(data.g);
  const a = parseFloat(data.a);

  if (g < -15) consult("empathetic");
  else if (g > 15) consult("realistic");
  else if (a > 15) consult("strict");
});

const questions = [
  "初対面でも話しかけられる",
  "一人の時間が好き",
  "計画を立てるのが好き",
  "直感を信じる",
  "人の感情に影響されやすい",
  "論理的に考える",
  "柔軟に対応できる",
  "決断が早い",
  "人に合わせがち",
  "将来をよく考える"
];

const qDiv = document.getElementById("questions");
questions.forEach((q, i) => {
  qDiv.innerHTML += `
    <p>${q}</p>
    <label><input type="radio" name="q${i}" value="yes">はい</label>
    <label><input type="radio" name="q${i}" value="no">いいえ</label>
  `;
});

async function diagnose() {
  const answers = questions.map((_, i) => {
    const v = document.querySelector(`input[name="q${i}"]:checked`);
    return v ? v.value : "no";
  });

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      message: `以下の回答からMBTIを1つ決定してください。\n${answers.join(",")}`
    })
  });

  const data = await res.json();
  const result = JSON.parse(data.choices[0].message.content);
  mbtiType = result.mbti;

  document.getElementById("result").innerHTML = `
    <h2>${result.mbti}</h2>
    <p>${result.description}</p>
    <p>${result.advice}</p>
  `;
}

async function consult(type) {
  if (type === currentAI || !mbtiType) return;
  currentAI = type;

  const roles = {
    empathetic: "優しく共感する相談相手",
    realistic: "現実的で冷静なアドバイザー",
    strict: "少し厳しいが的確な助言者"
  };

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      message: `MBTI:${mbtiType}\nあなたは${roles[type]}です。\n悩み: 人間関係に疲れています`
    })
  });

  const data = await res.json();
  document.getElementById("chat").innerText =
    `【${roles[type]}】\n` + data.choices[0].message.content;
}
</script>
</body>
</html>
