<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>MBTI診断＆AIチャット</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
body { font-family:sans-serif; background:#f7f7f7; padding:20px; }
h1,h2{text-align:center;}
.screen{display:none;}
.screen.active{display:block;}
.question{background:#fff;padding:16px;margin-bottom:16px;border-radius:10px;}
.answer-buttons{display:flex;gap:10px;}
button.answer{flex:1;padding:12px;border:none;border-radius:8px;background:#eee;font-size:16px;}
button.answer.selected{background:#ff9fbf;color:white;}
button{padding:14px;border:none;border-radius:10px;background:#ff5f9e;color:white;font-size:16px;width:100%;margin-top:20px;}
.ai-buttons{display:flex;gap:10px;}
.ai-buttons button{background:#ddd;color:#000;}
#chatBox{background:#fff;padding:20px;border-radius:10px;margin-top:20px;height:400px;overflow-y:auto;white-space:pre-wrap;}
#chatInput{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc;}
.message{margin-bottom:10px;}
.userMsg{color:#fff;background:#ff5f9e;padding:8px 12px;border-radius:10px;display:inline-block;}
.aiMsg{color:#000;background:#eee;padding:8px 12px;border-radius:10px;display:inline-block;}
</style>
</head>
<body>

<!-- ================= 診断画面 ================= -->
<div id="questionScreen" class="screen active">
  <h1>MBTI診断</h1>
  <div id="questions"></div>
  <button id="diagnoseBtn">診断する</button>
</div>

<!-- ================= 結果画面 ================= -->
<div id="resultScreen" class="screen">
  <h1>診断結果</h1>
  <h2 id="mbtiType"></h2>
  <p id="mbtiDesc"></p>

  <h2>このAIに相談する</h2>
  <div class="ai-buttons">
    <button onclick="startChat('friendly')">やさしいAI</button>
    <button onclick="startChat('strict')">厳しめAI</button>
    <button onclick="startChat('counselor')">カウンセラーAI</button>
  </div>
</div>

<!-- ================= チャット画面 ================= -->
<div id="chatScreen" class="screen">
  <h1 id="chatTitle"></h1>
  <div id="chatBox"></div>
  <input type="text" id="chatInput" placeholder="メッセージを入力" />
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ===== 質問 ===== */
const questions = [
  "初対面の人と話すのは楽しい",
  "計画を立てるのが好き",
  "一人の時間は必要不可欠だ",
  "論理より感情を大切にする",
  "新しいアイデアを考えるのが好き",
  "締切は守るタイプだ",
  "人の気持ちにすぐ気づく",
  "即断即決が得意だ"
];
const answers = {};
const qBox = document.getElementById("questions");
questions.forEach((q,i)=>{
  const div = document.createElement("div");
  div.className="question";
  div.innerHTML=`
    <p>${q}</p>
    <div class="answer-buttons">
      <button class="answer" data-q="${i}" data-v="Yes">Yes</button>
      <button class="answer" data-q="${i}" data-v="No">No</button>
    </div>`;
  qBox.appendChild(div);
});
qBox.addEventListener("click",e=>{
  if(!e.target.classList.contains("answer")) return;
  const q=e.target.dataset.q;
  answers[q]=e.target.dataset.v;
  document.querySelectorAll(`button[data-q="${q}"]`).forEach(b=>b.classList.remove("selected"));
  e.target.classList.add("selected");
});

/* ===== 診断 ===== */
document.getElementById("diagnoseBtn").onclick = ()=>{
  const summary = questions.map((q,i)=>`${q}：${answers[i]||"未回答"}`).join("\n");
  fetch("/api/",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt:summary})
  })
  .then(r=>r.json())
  .then(data=>{
    document.getElementById("mbtiType").textContent=data.data.mbti;
    document.getElementById("mbtiDesc").textContent=data.data.description+"（"+data.data.advice+"）";
    switchScreen("questionScreen","resultScreen");
  });
};

/* ===== Socket.IO & チャット ===== */
let socket = null;
let clientId = null;
let selectedPersona = 'friendly';
function startChat(persona){
  selectedPersona = persona;
  switchScreen("resultScreen","chatScreen");
  document.getElementById("chatTitle").textContent={
    friendly:"やさしいAI",
    strict:"厳しめAI",
    counselor:"カウンセラーAI"
  }[persona]+"とチャット中";

  clientId = Math.random().toString(36).substring(2,10);
  socket = io();
  socket.emit("user connected", clientId);

  socket.on("chat message", data=>{
    const chatBox=document.getElementById("chatBox");
    const div=document.createElement("div");
    div.className="message "+(data.id===clientId?"userMsg":"aiMsg");
    div.textContent=data.id===clientId?data.msg:data.msg;
    chatBox.appendChild(div);
    chatBox.scrollTop=chatBox.scrollHeight;
  });

  socket.on("welcome",()=>{});
}

/* ===== メッセージ送信 ===== */
const chatInput=document.getElementById("chatInput");
chatInput.addEventListener("keydown",e=>{
  if(e.key==="Enter" && chatInput.value.trim()!==""){
    const msg = chatInput.value.trim();
    socket.emit("chat message",{id:clientId,msg:msg,persona:selectedPersona,mbti:document.getElementById("mbtiDesc").textContent});
    chatInput.value="";
  }
});

/* ===== 画面切り替え ===== */
function switchScreen(from,to){
  document.getElementById(from).classList.remove("active");
  document.getElementById(to).classList.add("active");
}
</script>
</body>
</html>
