<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>気分フラワー🌸</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>
body {
  margin: 0;
  background: linear-gradient(#e9f8f2, #fff0f6);
  font-family: "Hiragino Maru Gothic ProN", sans-serif;
  text-align: center;
  color: #444;
}

h1 {
  color: #ff6fa5;
  margin-top: 20px;
  text-shadow: 1px 1px 2px white;
}

#quiz {
  max-width: 420px;
  margin: 20px auto;
  min-height: 200px;
}

.option {
  background: white;
  margin: 10px;
  padding: 12px;
  border-radius: 20px;
  cursor: pointer;
  border: 2px solid #ffd6e7;
  transition: 0.3s;
}

.option:hover {
  background: #ffe3ef;
  transform: scale(1.02);
}

button {
  padding: 12px 30px;
  border: none;
  border-radius: 25px;
  background: #ff6fa5;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#canvas-holder {
  width: 400px;
  height: 400px;
  margin: 0 auto;
}
</style>
</head>

<body>

<h1>気分フラワー🌸</h1>

<div id="quiz"></div>
<button id="nextBtn" onclick="next()">次へ</button>
<div id="canvas-holder"></div>

<script>
//質問・選択肢
const questions = [
  {
    q: "今日の予定は？",
    options: ["余裕がある","ほどほど","忙しい","余裕がない"]
  },
  {
    q: "朝の目覚めは？",
    options: ["すっきり","普通","眠い","つらい"]
  },
  {
    q: "今日の行動は？",
    options: ["挑戦","いつも通り","控えめ","何もしたくない"]
  },
  {
    q: "人との距離感は？",
    options: ["たくさん","適度","最低限","一人がいい"]
  },
  {
    q: "集中力は？",
    options: ["高い","普通","低め","続かない"]
  },
  {
    q: "生活リズムは？",
    options: ["整っている","まあまあ","乱れている","かなり乱れている"]
  },
  {
    q: "今日選ぶなら？",
    options: ["外出する","友だちと遊ぶ","家で過ごす","早く寝る"]
  }
];

let qIndex = 0;
let answers = [];

function showQuestion() {
  const box = document.getElementById("quiz");
  box.innerHTML = `<h2>${questions[qIndex].q}</h2>`;

  questions[qIndex].options.forEach(opt => {
    const d = document.createElement("div");
    d.className = "option";
    d.innerText = opt;
    d.onclick = () => {
      document.querySelectorAll(".option").forEach(o => o.style.background = "white");
      d.style.background = "#ffd6e7";
      answers[qIndex] = opt;
    };
    box.appendChild(d);
  });
}

function next() {
  if (!answers[qIndex]) return alert("選択してください");
  qIndex++;
  if (qIndex < questions.length) showQuestion();
  else diagnose();
}

async function diagnose() {
  const quizBox = document.getElementById("quiz");
  quizBox.innerHTML = "<h2>診断中…🌼</h2>";
  document.getElementById("nextBtn").style.display = "none";

  //サーバー経由で LLM 判断
  const res = await fetch("/api/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answers })
  });

  const data = await res.json();
  const flower = data.flower;

  //3D 花描画
  new p5(p => {
    p.setup = () => {
      p.createCanvas(400, 400, p.WEBGL);
      p.loop();
    };

    p.draw = () => {
      p.clear();
      p.noStroke();

      p.ambientLight(160, 160, 160);
      p.directionalLight(180, 180, 180, 0.6, 1, -1);

      let rotateSpeed, breatheAmount;
      if (flower.petalCount >= 7) {
        rotateSpeed = 0.004; breatheAmount = 0.04;
      } else if (flower.petalCount >= 4) {
        rotateSpeed = 0.002; breatheAmount = 0.02;
      } else {
        rotateSpeed = 0.0005; breatheAmount = 0.005;
      }

      const rot = p.frameCount * rotateSpeed;
      const breathe = 1 + Math.sin(p.frameCount * 0.05) * breatheAmount;

      p.rotateX(0.3);
      p.rotateZ(rot);

      p.push();
      p.scale(2 * breathe);

      p.ambientMaterial(flower.color.r, flower.color.g, flower.color.b);

      for (let i = 0; i < flower.petalCount; i++) {
        p.push();
        p.rotateZ(p.TWO_PI / 8 * i);
        p.translate(0, -45, 0);
        p.ellipsoid(32, 48, 18);
        p.pop();
      }

      p.push();
      p.ambientMaterial(230, 190, 60);
      p.scale(1, 1, 0.6);
      p.sphere(30);
      p.pop();

      p.pop();
    };
  }, "canvas-holder");

  quizBox.innerHTML = "<h2>あなたの花です🌸</h2>";
}

showQuestion();
</script>
</body>
</html>
